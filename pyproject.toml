[project]
name = "directional-unlearning"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "kaggle>=2.2.4",
    "numpy>=2.5.3",
    "pyyaml>=6.0.3",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
    "transformers>=5.17.0",
]

[project.optional-dependencies]
# Phase 5 only, and CUDA only. Not in the default set because bitsandbytes has no
# Apple Silicon build, so `uv sync` on the local machine would fail.
cuda = ["bitsandbytes>=0.43"]
