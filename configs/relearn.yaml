# Phase 4, relearning the forward direction. Answers Q1.
#
# PRE-REGISTERED (HANDOFF 7.4 / decision 17). Every value here was fixed before any
# Phase 4 run existed. Changing one after seeing recovery curves invalidates the
# comparison, because the outcome is which curve rises first.
lr: 1.0e-5              # same as Phase 1: a benign finetune, not a stronger push
n_templates: 5          # a nudge, not retraining; 5 of the 25 training templates
batch_size: 32
max_steps: 200
eval_every: 5
grad_clip: 1.0
target_accuracy: 0.90   # 90% of M1's forget-set forward accuracy, which is 1.00
eval:
  k_alts: 20            # in-loop alternatives (HANDOFF decision 12)
